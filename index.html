<!-- HTML: Three clickable cards for Lewis, Izzy, and Trevor -->
<div class="showcase">
  <div class="showcase-header">
    <h2>Meet the Crew!</h2>
    <p>Click on each name to discover a fun fact.</p>
  </div>

  <div class="showcase-cards">
    <button class="showcase-card" type="button">
      <span class="showcase-emoji">🐶</span>
      <span class="showcase-name">Lewis</span>
      <span class="showcase-hint">Click to reveal!</span>
      <span class="showcase-fact">Fun fact: Lewis loves to nap! 😴</span>
    </button>

    <button class="showcase-card" type="button">
      <span class="showcase-emoji">🐾</span>
      <span class="showcase-name">Izzy</span>
      <span class="showcase-hint">Click to reveal!</span>
      <span class="showcase-fact">Fun fact: Izzy likes to counter surf! 🥪</span>
    </button>

    <button class="showcase-card" type="button">
      <span class="showcase-emoji">🐕</span>
      <span class="showcase-name">Trevor</span>
      <span class="showcase-hint">Click to reveal!</span>
      <span class="showcase-fact">Fun fact: Trevor is a bottomfeeder! 😂</span>
    </button>
  </div>
</div>

<style>
/* CSS: Style the cards using your website's blue branding */
.showcase {
  font-family: 'Trebuchet MS', sans-serif;
  background-color: #EAF3FC;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  max-width: 700px;
  margin: 20px auto;
}

.showcase-header h2 {
  color: #4D93D9;
  font-size: 28px;
}

.showcase-header p {
  color: #24476B;
}

.showcase-cards {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.showcase-card {
  background-color: white;
  border: 2px solid #4D93D9;
  border-radius: 12px;
  padding: 20px 12px;
  width: 175px;
  cursor: pointer;
  font-family: 'Trebuchet MS', sans-serif;
  color: #24476B;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.showcase-card:hover {
  background-color: #D6E9FA;
}

.showcase-emoji {
  font-size: 35px;
}

.showcase-name {
  font-size: 20px;
  font-weight: bold;
}

.showcase-hint {
  font-size: 12px;
  color: #4D93D9;
}

.showcase-fact {
  display: none;
  font-size: 14px;
  line-height: 1.5;
}

.showcase-card.active .showcase-hint {
  display: none;
}

.showcase-card.active .showcase-fact {
  display: block;
}
</style>

<script>
// JavaScript: Reveal a fun fact when someone clicks a card
document.querySelectorAll('.showcase-card').forEach(function(card) {
  card.addEventListener('click', function() {
    card.classList.toggle('active');
  });
});
</script>
